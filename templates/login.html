{% extends "base.html" %}
{% block title %}Login — DataBazaar{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Login to access datasets and scraping tools</p>

        <form action="{{ url_for('auth_login') }}" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Login</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="{{ url_for('register_page') }}">Create one free</a>
        </p>
    </div>
</div>
{% endblock %}
